services:
  mysql:
    image: mysql:8.0.36
    container_name: etf-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Dwb5201314.}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-amazingdata_etf}
      MYSQL_USER: ${MYSQL_USER:-etf}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-etf123456}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=512M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-Dwb5201314.}"]
      interval: 10s
      timeout: 5s
      retries: 20
    mem_limit: 2g
    cpus: 2.0

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: etf-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: ${MYSQL_DATABASE:-amazingdata_etf}
      MYSQL_USER: ${MYSQL_USER:-etf}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-etf123456}
      APP_INFRA_REDIS_ENABLED: "false"
      APP_INFRA_RABBITMQ_ENABLED: "false"
      APP_INFRA_NACOS_ENABLED: "false"
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx768m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -Dfile.encoding=UTF-8}
    ports:
      - "8080:8080"
    mem_limit: 2g
    cpus: 2.0

volumes:
  mysql_data:
